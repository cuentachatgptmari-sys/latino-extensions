name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.1

      - name: Fix provider build files
        run: |
          for f in $(find . -path "./.git" -prune -o -name "build.gradle.kts" -print | grep -v "^\./build.gradle.kts$"); do
            if grep -q "cloudstream {" "$f" && ! grep -q "apply(plugin" "$f"; then
              sed -i '1s/^/apply(plugin = "com.lagradost.cloudstream3.cloudstreamPlugin")\n\n/' "$f"
              echo "Fixed: $f"
            fi
          done

      - name: Build with Gradle
        run: gradle build

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: "**/build/outputs/**/*.cs3"

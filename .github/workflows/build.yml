name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Fix provider build files
        run: |
          find . -not -path "./.git/*" -name "build.gradle.kts" ! -path "./build.gradle.kts" | while read f; do
            sed -i '/apply(plugin = "com.lagradost.cloudstream3.cloudstreamPlugin")/d' "$f"
          done
          python3 fix_providers.py

      - name: Build with Gradle
        run: gradle makePlugins

      - name: Deploy to builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ../deploy
          find . -name "*.cs3" -exec cp {} ../deploy/ \;
          find . -name "plugins.json" ! -path "./.git/*" | head -1 | xargs -I{} cp {} ../deploy/ 2>/dev/null || true
          python3 generate_repo.py ../deploy
          cd ../deploy
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -b builds
          git add .
          git commit -m "Build ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cuentachatgptmari-sys/latino-extensions.git" builds

      - name: Upload plugins artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: "**/*.cs3"

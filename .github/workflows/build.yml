name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Fix provider build files
        run: |
          find . -not -path "./.git/*" -name "build.gradle.kts" ! -path "./build.gradle.kts" | while read f; do
            sed -i '/apply(plugin = "com.lagradost.cloudstream3.cloudstreamPlugin")/d' "$f"
            echo "Fixed gradle: $f"
          done
          find . -not -path "./.git/*" -name "*.kt" | while read f; do
            sed -i '/override val hasSearch/d' "$f"
            echo "Fixed kt: $f"
          done

      - name: Build with Gradle
        run: gradle makePlugins

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: "**/*.cs3"

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Fix provider build files
        run: |
          find . -not -path "./.git/*" -name "build.gradle.kts" ! -path "./build.gradle.kts" | while read f; do
            sed -i '/apply(plugin = "com.lagradost.cloudstream3.cloudstreamPlugin")/d' "$f"
          done
          python3 fix_providers.py

      - name: Build with Gradle
        run: gradle makePlugins

      - name: Deploy to builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd ..
          mkdir -p deploy
          # Copiar todos los .cs3
          find latino-extensions -name "*.cs3" | while read f; do
            cp "$f" deploy/
          done
          # Copiar plugins.json generado por makePlugins
          find latino-extensions -name "plugins.json" ! -path "*/node_modules/*" | head -1 | xargs -I{} cp {} deploy/ 2>/dev/null || true
          # Si no existe plugins.json, generarlo manualmente
          if [ ! -f deploy/plugins.json ]; then
            echo "Generating plugins.json..."
            cd deploy
            python3 - << 'PYEOF'
import os, json
plugins = []
for f in os.listdir('.'):
    if f.endswith('.cs3'):
        name = f.replace('.cs3', '')
        plugins.append({
            "url": f"https://raw.githubusercontent.com/cuentachatgptmari-sys/latino-extensions/builds/{f}",
            "status": 1,
            "version": 1,
            "apiVersion": 1,
            "name": name,
            "internalName": name,
            "authors": ["cuentachatgptmari-sys"],
            "description": "Peliculas y series en español latino",
            "repositoryUrl": "https://github.com/cuentachatgptmari-sys/latino-extensions"
        })
with open('plugins.json', 'w') as f:
    json.dump(plugins, f, indent=2)
print(f"Generated plugins.json with {len(plugins)} plugins")
PYEOF
            cd ..
          fi
          # Crear repo.json
          cat > deploy/repo.json << 'JSONEOF'
{
  "name": "Latino Extensions",
  "description": "19 extensiones de peliculas y series en español latino",
  "manifestVersion": 1,
  "pluginLists": [
    "https://raw.githubusercontent.com/cuentachatgptmari-sys/latino-extensions/builds/plugins.json"
  ]
}
JSONEOF
          # Deploy al branch builds
          cd deploy
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -b builds
          git add .
          git commit -m "Build ${{ github.sha }}"
          git push --force "https://${{ secrets.GITHUB_TOKEN }}@github.com/cuentachatgptmari-sys/latino-extensions.git" builds

      - name: Upload plugins artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: "**/*.cs3"

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Fix provider build files
        run: |
          # Eliminar apply incorrecto de build.gradle.kts
          find . -not -path "./.git/*" -name "build.gradle.kts" ! -path "./build.gradle.kts" | while read f; do
            sed -i '/apply(plugin = "com.lagradost.cloudstream3.cloudstreamPlugin")/d' "$f"
          done

          # Eliminar hasSearch de todos los .kt
          find . -not -path "./.git/*" -name "*.kt" | while read f; do
            sed -i '/override val hasSearch/d' "$f"
          done

          # Agregar @CloudstreamPlugin a todos los .kt que no lo tengan
          find . -not -path "./.git/*" -name "*.kt" | while read f; do
            if ! grep -q "@CloudstreamPlugin" "$f"; then
              # Obtener nombre de la clase principal
              CLASSNAME=$(grep -o 'class [A-Za-z0-9]*Provider' "$f" | head -1 | awk '{print $2}')
              if [ -n "$CLASSNAME" ]; then
                PACKAGE=$(grep '^package' "$f")
                # Reescribir el archivo con la estructura correcta
                CONTENT=$(cat "$f")
                cat > "$f" << KOTLIN
$PACKAGE

import com.lagradost.cloudstream3.plugins.CloudstreamPlugin
import com.lagradost.cloudstream3.plugins.Plugin
import android.content.Context

@CloudstreamPlugin
class ${CLASSNAME}Plugin : Plugin() {
    override fun load(context: Context) {
        registerMainAPI(${CLASSNAME}())
    }
}

$(echo "$CONTENT" | grep -v '^package ')
KOTLIN
                echo "Fixed @CloudstreamPlugin: $f"
              fi
            fi
          done

      - name: Build with Gradle
        run: gradle makePlugins

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: "**/*.cs3"

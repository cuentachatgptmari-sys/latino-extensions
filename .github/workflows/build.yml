name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PKG_TOKEN: ${{ secrets.GH_TOKEN }}
      PKG_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.5.1

      - name: Fix provider build files
        run: |
          find . -not -path "./.git/*" -name "build.gradle.kts" ! -path "./build.gradle.kts" | while read f; do
            sed -i '/apply(plugin = "com.lagradost.cloudstream3.cloudstreamPlugin")/d' "$f"
            sed -i '/apply(plugin = "com.lagradost.cloudstream3.gradle")/d' "$f"
            echo "Fixed: $f"
          done

      - name: Give gradlew execute permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: gradle build

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: "**/build/outputs/**/*.cs3"
